name: CI

on:
  pull_request:
  push:
    branches: [main]

# GL-30: this repo has no MSBuild project and no package.json (README.md "Keeping shared files
# identical across repos"), so "build and test" here means the one thing that IS testable without
# the stack running: that docker-compose.yml's local-feed wiring hasn't drifted. See
# scripts/check-feed-wiring.sh for what it asserts and why `docker compose config` is cheap
# enough to run on every push.
jobs:
  feed-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check local-feed mount wiring
        run: ./scripts/check-feed-wiring.sh
